    <!-- strip chart mock -->
    <rect x="40" y="250" width="580" height="120" rx="10" fill="#fdfdfd" stroke="#e1e4e8"/>
    <line x1="64" y1="280" x2="64" y2="340" stroke="#c4c9d0"/>
    <line x1="64" y1="340" x2="596" y2="340" stroke="#c4c9d0"/>
    <circle cx="140" cy="300" r="6" fill="#0f8a3a"/>
